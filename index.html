<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23dd6800%27/%3E%3Ccircle cx=%278%27 cy=%279%27 r=%275%27 fill=%27%23fa0500%27/%3E%3C/svg%3E" />
<title>DIG DUG - 1982 Arcade</title>
<link rel="stylesheet" href="style.css?v=8" />
</head>
<body>
<div id="game-wrapper">
  <div id="topbar">
    <a id="back-link" href="https://wethepeoplepress.com/games/">&larr; WTP ARCADE</a>
    <button type="button" id="btn-pause" class="mini-btn" aria-label="Pause">PAUSE</button>
    <button type="button" id="btn-mute" class="mini-btn" aria-label="Mute">SOUND ON</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="224" height="288" aria-label="Dig Dug game"></canvas>
  </div>
  <div id="help">ARROWS / WASD - MOVE &amp; DIG &middot; SPACE / CTRL - PUMP &middot; 5 - COIN &middot; ENTER / 1 - START &middot; P - PAUSE &middot; M - MUTE &middot; BUILD 8</div>
  <div id="mobile-controls" aria-label="Touch controls">
    <div id="dpad" aria-label="Direction pad">
      <span class="dp" data-dir="U">&#9650;</span><span class="dp" data-dir="L">&#9664;</span>
      <span class="dp" data-dir="R">&#9654;</span><span class="dp" data-dir="D">&#9660;</span>
    </div>
    <button type="button" id="btn-pump" aria-label="Pump">PUMP</button>
  </div>
</div>
<script src="game.js?v=8"></script>
<script>(function(){var t;function f(){clearTimeout(t);t=setTimeout(function(){document.documentElement.style.height=window.innerHeight+"px";window.dispatchEvent(new Event("resize"));},60);}window.addEventListener("orientationchange",function(){f();setTimeout(f,350);setTimeout(f,800);});if(window.visualViewport)visualViewport.addEventListener("resize",f);if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener("change",f);})();</script>
</body>
</html>
